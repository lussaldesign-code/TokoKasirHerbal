name: Publish Supabase POS

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Supabase app the main page
        run: cp index-supabase.html index.html
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish Supabase POS as main page"
          git push
