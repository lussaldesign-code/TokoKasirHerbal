name: Publish Supabase POS

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html

concurrency:
  group: publish-supabase-index
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Supabase app the main page
        run: cp index-supabase.html index.html

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html sudah sama, tidak ada commit."
            exit 0
          fi
          git commit -m "Publish Supabase POS as main page"

      - name: Rebase generated commit onto latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push generated index
        run: git push origin HEAD:main
