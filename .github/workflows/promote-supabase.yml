name: Keep Web source isolated

on:
  workflow_dispatch:

# Web and APK sources are intentionally separated.
# This workflow is manual-only and never copies index-supabase.html
# over the Web entry point index.html.

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify separated sources
        run: |
          test -f index.html
          test -f index-supabase.html
          echo "Web source: index.html"
          echo "APK source: index-supabase.html"
          echo "No Web files are generated or committed."
