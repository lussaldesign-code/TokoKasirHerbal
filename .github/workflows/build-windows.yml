name: Build TokoKasirHerbal Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - index.html
      - index-supabase.html
      - app.js
      - config.js
      - .github/workflows/build-windows.yml
      - '!TokoKasirHerbal-latest.exe'
      - '!windows-update.json'

permissions:
  contents: write

concurrency:
  group: tokokasirherbal-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup-*.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'Installer EXE tidak ditemukan di folder dist.'
            exit 1
          }
          Write-Host "Installer ditemukan: $($installer.FullName)"
          Write-Host "Ukuran: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirHerbal-Windows-Installer
          path: dist/*Setup-*.exe
          if-no-files-found: error

      - name: Publish compatibility manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup-*.exe' | Select-Object -First 1
          $version = node -p "require('./package.json').version"
          Copy-Item $installer.FullName "TokoKasirHerbal-latest.exe" -Force
          $hash = (Get-FileHash "TokoKasirHerbal-latest.exe" -Algorithm SHA256).Hash.ToLower()
          @"
          {
            "version": "$version",
            "installer": "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/TokoKasirHerbal-latest.exe",
            "sha256": "$hash"
          }
          "@ | Set-Content -Path windows-update.json -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TokoKasirHerbal-latest.exe windows-update.json
          if (git diff --cached --quiet) {
            Write-Host "Tidak ada perubahan compatibility manifest."
            exit 0
          }
          git commit -m "chore: publish Windows compatibility updater v$version"
          git pull --rebase origin main
          git push origin HEAD:main
