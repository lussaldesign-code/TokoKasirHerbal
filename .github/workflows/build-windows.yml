name: Build TokoKasirHerbal Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - index.html
      - index-supabase.html
      - app.js
      - config.js
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup-*.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'Installer EXE tidak ditemukan di folder dist.'
            exit 1
          }
          Write-Host "Installer ditemukan: $($installer.FullName)"
          Write-Host "Ukuran: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirHerbal-Windows-Installer
          path: dist/*Setup-*.exe
          if-no-files-found: error
