name: Build TokoKasirHerbal Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - index.html
      - index-supabase.html
      - app.js
      - config.js
      - .github/workflows/build-windows.yml
      - '!TokoKasirHerbal-latest.exe'
      - '!windows-update.json'

permissions:
  contents: write

concurrency:
  group: tokokasirherbal-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          # Check without allowing a missing release to fail the workflow.
          $releaseExists = $false
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          }
          $global:LASTEXITCODE = 0

          if ($releaseExists) {
            Write-Host "Existing release $tag found. Removing it before republishing metadata."
            gh release delete $tag --yes --cleanup-tag
            $deleteCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            if ($deleteCode -ne 0) {
              throw "Gagal menghapus release GitHub $tag (exit code $deleteCode)."
            }
          } else {
            Write-Host "No existing release $tag to remove. Continuing with build."
          }

          # Never leave a non-zero native command exit code as the final
          # PowerShell status when the release simply does not exist.
          $global:LASTEXITCODE = 0

          # electron-builder requires the release tag to already exist when publishing.
          # Recreate the version tag after the optional release cleanup above.
          git tag -f $tag
          git push origin "refs/tags/$tag" --force

      - name: Build and publish Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      - name: Verify GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release view "v$version" --json tagName,isDraft,isLatest,url
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release v$version tidak ditemukan setelah build."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup-*.exe' | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'Installer EXE tidak ditemukan di folder dist.'
            exit 1
          }
          Write-Host "Installer ditemukan: $($installer.FullName)"
          Write-Host "Ukuran: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirHerbal-Windows-Installer
          path: dist/*Setup-*.exe
          if-no-files-found: error

      - name: Publish compatibility manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*Setup-*.exe' | Select-Object -First 1
          $version = node -p "require('./package.json').version"

          # Sync the branch BEFORE generating compatibility files.
          # The previous order generated windows-update.json and then reset --hard,
          # which silently discarded the generated manifest.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          Copy-Item $installer.FullName "TokoKasirHerbal-latest.exe" -Force
          $hash = (Get-FileHash "TokoKasirHerbal-latest.exe" -Algorithm SHA256).Hash.ToLower()
          @"
          {
            "version": "$version",
            "installer": "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/TokoKasirHerbal-latest.exe",
            "sha256": "$hash"
          }
          "@ | Set-Content -Path windows-update.json -Encoding utf8

          git add TokoKasirHerbal-latest.exe windows-update.json
          if (git diff --cached --quiet) {
            Write-Host "Tidak ada perubahan compatibility manifest."
            exit 0
          }
          git commit -m "chore: publish Windows compatibility updater v$version"
          git push origin HEAD:main
