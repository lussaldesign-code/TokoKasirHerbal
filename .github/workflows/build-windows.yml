name: Build TokoKasirHerbal Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - index.html
      - index-supabase.html
      - app.js
      - config.js
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirHerbal-Windows-Installer
          path: dist/*Setup-*.exe
          if-no-files-found: error
