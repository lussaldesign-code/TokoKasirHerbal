name: Build TokoKasirLussal APK
# APK build pipeline with versioned Android builds and in-app update manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index-supabase.html'
      - 'app.js'
      - 'config.js'
      - 'package.json'
      - 'capacitor.config.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-192.svg'
      - 'icon-512.svg'
      - 'apk-navigation.css'
      - 'apk-navigation.js'
      - 'apk-update.js'
      - 'apk-version.txt'
      - '.github/workflows/build-apk.yml'
      - '!TokoKasirLussal-latest.apk'
      - '!update.json'

concurrency:
  group: tokokasirlussal-android-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare web files
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js mobile/www/
          # APK-only navigation overlay. Web/PWA and Windows source files remain untouched.
          cp apk-navigation.css apk-navigation.js apk-update.js mobile/www/
          python3 - <<PY
          from pathlib import Path
          import re
          p=Path('mobile/www/app.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const APP_VERSION='[^']*';", "const APP_VERSION='$VERSION';", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
          sed -i "s#config.js#config.js?v=$VERSION#g" mobile/www/index.html
          sed -i "s#app.js#app.js?v=$VERSION#g" mobile/www/index.html
          sed -i "s#tokokasirlussal-v[0-9.]*#tokokasirlussal-v$VERSION#g" mobile/www/sw.js
          python3 - <<PY
          from pathlib import Path
          p=Path('mobile/www/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</head>', '<link rel="stylesheet" href="apk-navigation.css?v=$VERSION"></head>', 1)
          s=s.replace('</body>', '<script src="apk-navigation.js?v=$VERSION"></script><script src="apk-update.js?v=$VERSION"></script></body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          test -s mobile/www/index.html
          test -s mobile/www/app.js
          test -s mobile/www/config.js
          test -s mobile/www/apk-navigation.css
          test -s mobile/www/apk-navigation.js
          test -s mobile/www/apk-update.js

      - name: Install npm packages
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        run: |
          rm -rf android
          ./node_modules/.bin/cap add android

      - name: Set Android version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          VERSION_CODE="$(node -e "const v=require('fs').readFileSync('apk-version.txt','utf8').trim().split('.').map(Number); console.log(v[0]*10000+v[1]*100+v[2])")"
          export VERSION VERSION_CODE
          python3 - <<'PY'
          import os,re
          p='android/app/build.gradle'
          s=open(p).read()
          version=os.environ['VERSION']
          code=os.environ['VERSION_CODE']
          s=re.sub(r'versionCode\s+\d+', f'versionCode {code}', s)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', f'versionName "{version}"', s)
          open(p,'w').write(s)
          PY
          echo "Android version: $VERSION"
          echo "Android versionCode: $VERSION_CODE"

      - name: Add native APK updater bridge
        shell: bash
        run: |
          set -e
          SRC="android/app/src/main/java/com/lussaldesign/tokokasirlussal"
          mkdir -p "$SRC"
          cat > "$SRC/UpdateBridge.java" <<'JAVA'
package com.lussaldesign.tokokasirlussal;

import android.app.DownloadManager;
import android.content.Context;
import android.content.Intent;
import android.net.Uri;
import android.os.Build;
import android.os.Environment;
import android.provider.Settings;
import android.webkit.JavascriptInterface;
import java.util.Locale;

public class UpdateBridge {
    private final Context context;
    private final DownloadManager manager;
    public UpdateBridge(Context context) {
        this.context=context.getApplicationContext();
        this.manager=(DownloadManager)context.getSystemService(Context.DOWNLOAD_SERVICE);
    }
    @JavascriptInterface public String downloadApk(String url, String version) {
        try {
            DownloadManager.Request request=new DownloadManager.Request(Uri.parse(url));
            request.setTitle("TokoKasirLussal update");
            request.setDescription("Mengunduh update aplikasi...");
            request.setMimeType("application/vnd.android.package-archive");
            request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
            request.setAllowedOverMetered(true);
            request.setAllowedOverRoaming(false);
            request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,"TokoKasirLussal-update-v"+(version==null||version.isEmpty()?"latest":version)+".apk");
            return String.valueOf(manager.enqueue(request));
        } catch(Exception e) { return "0"; }
    }
    @JavascriptInterface public String getStatus(String idText) {
        DownloadManager.Query query=new DownloadManager.Query();
        try {
            long id=Long.parseLong(idText); query.setFilterById(id);
            android.database.Cursor c=manager.query(query);
            if(c==null)return "{\"status\":\"error\",\"message\":\"DownloadManager tidak tersedia.\"}";
            try {
                if(!c.moveToFirst())return "{\"status\":\"error\",\"message\":\"Download tidak ditemukan.\"}";
                int st=c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                long received=c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                long total=c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                if(st==DownloadManager.STATUS_SUCCESSFUL)return json("success",received,total,"");
                if(st==DownloadManager.STATUS_FAILED){
                    int reason=c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_REASON));
                    return json("failed",received,total,"DownloadManager error "+reason);
                }
                return json("downloading",received,total,"");
            } finally { c.close(); }
        } catch(Exception e) {
            return "{\"status\":\"error\",\"message\":\"" + escape(e.getMessage()) + "\"}";
        }
    }
    @JavascriptInterface public String installApk(String idText) {
        try {
            long id=Long.parseLong(idText);
            Uri uri=manager.getUriForDownloadedFile(id);
            if(uri==null)return "File update belum selesai diunduh.";
            if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O && !context.getPackageManager().canRequestPackageInstalls()){
                Intent settings=new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:"+context.getPackageName()));
                settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                context.startActivity(settings);
                return "permission";
            }
            Intent intent=new Intent(Intent.ACTION_INSTALL_PACKAGE);
            intent.setDataAndType(uri,"application/vnd.android.package-archive");
            intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_ACTIVITY_NEW_TASK);
            context.startActivity(intent);
            return "ok";
        } catch(Exception e) { return "error: "+e.getMessage(); }
    }
    private static String json(String status,long received,long total,String message){
        return String.format(Locale.US,"{\"status\":\"%s\",\"received\":%d,\"total\":%d,\"message\":\"%s\"}",status,received,total,escape(message));
    }
    private static String escape(String s){return s==null?"":s.replace("\\","\\\\").replace("\"","\\\"").replace("\n"," ");}
}

JAVA
          cat > "$SRC/MainActivity.java" <<'JAVA'
package com.lussaldesign.tokokasirlussal;

import android.os.Bundle;
import android.webkit.WebView;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        WebView webView=getBridge().getWebView();
        if(webView!=null)webView.addJavascriptInterface(new UpdateBridge(this),"AndroidUpdater");
    }
}

JAVA
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          perm='<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n'
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s=s.replace('<manifest ', '<manifest '+perm, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Sync Android
        run: ./node_modules/.bin/cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Check APK
        run: |
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: TokoKasirLussal-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK for in-app updates
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          # Sync the branch BEFORE generating the files that must be published.
          # The previous order generated update.json first and then reset --hard,
          # which silently discarded the new manifest and made the updater stay old.
          git fetch origin main
          git reset --hard origin/main

          cp "$APK" "TokoKasirLussal-latest.apk"
          SHA256="$(sha256sum "TokoKasirLussal-latest.apk" | awk '{print $1}')"
          cat > update.json <<EOF
          {
            "version": "$VERSION",
            "apk": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/TokoKasirLussal-latest.apk",
            "sha256": "$SHA256"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TokoKasirLussal-latest.apk update.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan file update."
            exit 0
          fi
          git commit -m "chore: publish Android APK v$VERSION"
          git push origin HEAD:main
