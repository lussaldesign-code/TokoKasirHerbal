name: Build TokoKasirHerbal APK
# APK build pipeline with versioned Android builds and in-app update manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index-supabase.html'
      - 'app.js'
      - 'config.js'
      - 'package.json'
      - 'capacitor.config.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-192.svg'
      - 'icon-512.svg'
      - '.github/workflows/build-apk.yml'
      - '!TokoKasirHerbal-latest.apk'
      - '!update.json'

concurrency:
  group: tokokasirherbal-android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare web files
        run: |
          set -e
          VERSION="$(node -p "require('./package.json').version")"
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js mobile/www/
          sed -i "s#config.js#config.js?v=$VERSION#g" mobile/www/index.html
          sed -i "s#app.js#app.js?v=$VERSION#g" mobile/www/index.html
          sed -i "s#tokokasirherbal-v[0-9.]*#tokokasirherbal-v$VERSION#g" mobile/www/sw.js
          test -s mobile/www/index.html
          test -s mobile/www/app.js
          test -s mobile/www/config.js

      - name: Install npm packages
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        run: |
          rm -rf android
          ./node_modules/.bin/cap add android

      - name: Set Android version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const v=require('./package.json').version.split('.').map(Number); console.log(v[0]*10000+v[1]*100+v[2])")"
          python3 - <<'PY'
          import os,re
          p='android/app/build.gradle'
          s=open(p).read()
          version=os.environ['VERSION']
          code=os.environ['VERSION_CODE']
          s=re.sub(r'versionCode\s+\d+', f'versionCode {code}', s)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', f'versionName "{version}"', s)
          open(p,'w').write(s)
          PY

      - name: Sync Android
        run: ./node_modules/.bin/cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Check APK
        run: |
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: TokoKasirHerbal-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK for in-app updates
        run: |
          set -e
          VERSION="$(node -p "require('./package.json').version")"
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          cp "$APK" "TokoKasirHerbal-latest.apk"
          SHA256="$(sha256sum "TokoKasirHerbal-latest.apk" | awk '{print $1}')"
          cat > update.json <<EOF
          {
            "version": "$VERSION",
            "apk": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/TokoKasirHerbal-latest.apk",
            "sha256": "$SHA256"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TokoKasirHerbal-latest.apk update.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan file update."
            exit 0
          fi
          git commit -m "chore: publish Android APK v$VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
