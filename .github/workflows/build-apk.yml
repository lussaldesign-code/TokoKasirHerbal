name: Build APK (Compatibility Launcher)

# This workflow restores the original APK workflow entry point without
# requiring the old ANDROID_KEYSTORE_BASE64 signing secret.
# The actual build is performed by build-apk-v2.yml.

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  launch-apk-v2:
    name: Launch APK V2 build
    runs-on: ubuntu-24.04
    steps:
      - name: Start active APK V2 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk-v2.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "APK V2 workflow dispatched successfully."
