name: Legacy APK Build (Disabled)

# This workflow is intentionally kept as a compatibility stub.
# The active APK pipeline is .github/workflows/build-apk-v2.yml.
# Keeping this workflow as a no-op prevents the old signing pipeline from
# failing when ANDROID_KEYSTORE_BASE64 is not configured.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index-supabase.html'
      - 'app.js'
      - 'config.js'
      - 'capacitor.config.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-192.svg'
      - 'icon-512.svg'
      - 'apk-navigation.css'
      - 'apk-navigation.js'
      - 'apk-update.js'
      - 'apk-native-bridge.sh'
      - 'apk-version.txt'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: tokokasirlussal-legacy-apk-stub
  cancel-in-progress: true

jobs:
  disabled:
    name: Legacy APK pipeline disabled
    runs-on: ubuntu-24.04
    steps:
      - name: Use APK V2 pipeline
        run: |
          echo "Legacy build-apk.yml is disabled."
          echo "The active APK build is .github/workflows/build-apk-v2.yml."
          echo "No Android keystore secrets are required by this legacy stub."
