name: Build TokoKasirLussal APK
# Original APK build pipeline restored. APK-only changes are injected during build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index-supabase.html'
      - 'app.js'
      - 'config.js'
      - 'capacitor.config.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-192.svg'
      - 'icon-512.svg'
      - 'apk-navigation.css'
      - 'apk-navigation.js'
      - 'apk-update.js'
      - 'apk-native-bridge.sh'
      - 'apk-version.txt'
      - '.github/workflows/build-apk.yml'
      - '!TokoKasirLussal-latest.apk'
      - '!update.json'

concurrency:
  group: tokokasirlussal-apk-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare web files
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js mobile/www/
          cp apk-navigation.css apk-navigation.js apk-update.js mobile/www/
          python3 - <<PY
          from pathlib import Path
          import re
          p=Path('mobile/www/app.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const APP_VERSION='[^']*';", "const APP_VERSION='$VERSION';", s, count=1)
          p.write_text(s, encoding='utf-8')
          p=Path('mobile/www/apk-update.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CURRENT_VERSION='[^']*';", "const CURRENT_VERSION='$VERSION';", s, count=1)
          s=s.replace("const CURRENT_VERSION = '__APK_VERSION__';", "const CURRENT_VERSION = '$VERSION';", 1)
          p.write_text(s, encoding='utf-8')
          PY
          sed -i "s#config.js#config.js?v=$VERSION#g" mobile/www/index.html
          sed -i "s#app.js#app.js?v=$VERSION#g" mobile/www/index.html
          sed -i "s#tokokasirlussal-v[0-9.]*#tokokasirlussal-v$VERSION#g" mobile/www/sw.js
          python3 - <<PY
          from pathlib import Path
          p=Path('mobile/www/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</head>', '<link rel="stylesheet" href="apk-navigation.css?v=$VERSION"></head>', 1)
          s=s.replace('</body>', '<script src="apk-navigation.js?v=$VERSION"></script><script src="apk-update.js?v=$VERSION"></script></body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          test -s mobile/www/index.html
          test -s mobile/www/app.js
          test -s mobile/www/config.js
          test -s mobile/www/apk-navigation.css
          test -s mobile/www/apk-navigation.js
          test -s mobile/www/apk-update.js

      - name: Install npm packages
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        run: |
          rm -rf android
          ./node_modules/.bin/cap add android

      - name: Set Android version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          VERSION_CODE="$(node -e "const v=require('fs').readFileSync('apk-version.txt','utf8').trim().split('.').map(Number); console.log(v[0]*10000+v[1]*100+v[2])")"
          export VERSION VERSION_CODE
          python3 - <<'PY'
          import os,re
          p='android/app/build.gradle'
          s=open(p).read()
          version=os.environ['VERSION']
          code=os.environ['VERSION_CODE']
          s=re.sub(r'versionCode\s+\d+', f'versionCode {code}', s)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', f'versionName "{version}"', s)
          open(p,'w').write(s)
          PY

      - name: Add native APK updater bridge
        run: bash apk-native-bridge.sh

      - name: Sync Android
        run: ./node_modules/.bin/cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Check APK
        run: |
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: TokoKasirLussal-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          RELEASE_APK="TokoKasirLussal-v$VERSION.apk"
          git fetch origin main
          git reset --hard origin/main
          cp "$APK" "$RELEASE_APK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$RELEASE_APK" --clobber
          else
            gh release create "v$VERSION" "$RELEASE_APK#TokoKasirLussal APK v$VERSION" \
              --title "TokoKasirLussal Android v$VERSION" \
              --notes "Android APK v$VERSION" \
              --target main
          fi
