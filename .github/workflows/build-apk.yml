name: Build TokoKasirHerbal APK
# APK build pipeline: Node 24, no npm cache/lockfile requirement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index-supabase.html'
      - 'app.js'
      - 'config.js'
      - 'package.json'
      - 'capacitor.config.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify build environment
        run: |
          node --version
          npm --version
          java -version
          sdkmanager --version
          test -f package.json
          test -f capacitor.config.js
          test ! -e capacitor.config.ts
          test ! -e capacitor.config.json

      - name: Prepare web files
        run: |
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js mobile/www/
          sed -i 's#config.js#config.js?v=20260927#g' mobile/www/index.html
          sed -i 's#app.js#app.js?v=20260927#g' mobile/www/index.html
          test -s mobile/www/index.html
          test -s mobile/www/app.js
          test -s mobile/www/config.js

      - name: Install npm packages
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify Capacitor packages
        run: |
          test -x ./node_modules/.bin/cap
          ./node_modules/.bin/cap --version
          node -e "console.log('core', require('@capacitor/core/package.json').version)"
          node -e "console.log('android', require('@capacitor/android/package.json').version)"
          node -e "console.log('cli', require('@capacitor/cli/package.json').version)"

      - name: Generate Android project
        run: |
          rm -rf android
          ./node_modules/.bin/cap add android

      - name: Sync Android
        run: ./node_modules/.bin/cap sync android

      - name: Verify Android project
        run: |
          test -x android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle
          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Check APK
        run: |
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TokoKasirHerbal-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
