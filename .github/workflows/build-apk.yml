name: Build TokoKasirHerbal APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index-supabase.html'
      - 'app.js'
      - 'config.js'
      - 'package.json'
      - 'capacitor.config.js'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare web files
        run: |
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js mobile/www/
          sed -i 's#config.js#config.js?v=20260923#g' mobile/www/index.html
          sed -i 's#app.js#app.js?v=20260923#g' mobile/www/index.html

      - name: Install npm packages
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify Capacitor
        run: |
          test -f capacitor.config.js
          test ! -e capacitor.config.ts
          ./node_modules/.bin/cap --version
          node -e "console.log(require('@capacitor/android/package.json').version)"

      - name: Generate Android project
        run: |
          rm -rf android
          ./node_modules/.bin/cap add android

      - name: Sync Android
        run: ./node_modules/.bin/cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Check APK
        run: |
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirHerbal-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
