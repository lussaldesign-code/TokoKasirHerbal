name: Build TokoKasirLussal APK

on:
  workflow_dispatch:
  push:
    branches: [main, push-notification-apk]
    paths:
      - 'index-supabase.html'
      - 'app.js'
      - 'config.js'
      - 'capacitor.config.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-192.svg'
      - 'icon-512.svg'
      - 'apk-navigation.css'
      - 'apk-navigation.js'
      - 'apk-update.js'
      - 'apk-native-bridge.sh'
      - 'apk-push-notification.js'
      - 'package.json'
      - 'apk-version.txt'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: tokokasirlussal-apk-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare web files
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js mobile/www/
          cp apk-navigation.css apk-navigation.js apk-update.js apk-push-notification.js mobile/www/
          python3 - <<PY
          from pathlib import Path
          import re
          p=Path('mobile/www/app.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const APP_VERSION='[^']*';", "const APP_VERSION='$VERSION';", s, count=1)
          p.write_text(s, encoding='utf-8')
          p=Path('mobile/www/apk-update.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CURRENT_VERSION='[^']*';", "const CURRENT_VERSION='$VERSION';", s, count=1)
          s=s.replace("const CURRENT_VERSION = '__APK_VERSION__';", "const CURRENT_VERSION = '$VERSION';", 1)
          p.write_text(s, encoding='utf-8')
          p=Path('mobile/www/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</head>', '<link rel="stylesheet" href="apk-navigation.css?v=$VERSION"></head>', 1)
          s=s.replace('</body>', '<script src="apk-navigation.js?v=$VERSION"></script><script src="apk-update.js?v=$VERSION"></script><script src="apk-push-notification.js?v=$VERSION"></script></body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          sed -i "s#config.js#config.js?v=$VERSION#g" mobile/www/index.html
          sed -i "s#app.js#app.js?v=$VERSION#g" mobile/www/index.html
          sed -i "s#tokokasirlussal-v[0-9.]*#tokokasirlussal-v$VERSION#g" mobile/www/sw.js

      - name: Detect Firebase configuration
        id: firebase
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Firebase Android configuration is available."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Firebase Android configuration is not configured; building a stable APK without the native push plugin."
          fi

      - name: Disable push plugin when Firebase is unavailable
        if: steps.firebase.outputs.configured != 'true'
        shell: bash
        run: |
          set -e
          npm pkg delete dependencies.@capacitor/push-notifications
          echo "Push plugin disabled for this build because Firebase configuration is not available."

      - name: Install npm packages
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        run: |
          rm -rf android
          ./node_modules/.bin/cap add android

      - name: Add Firebase Android configuration
        if: steps.firebase.outputs.configured == 'true'
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Set Android version
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          VERSION_CODE="$(node -e "const v=require('fs').readFileSync('apk-version.txt','utf8').trim().split('.').map(Number); console.log(v[0]*10000+v[1]*100+v[2])")"
          export VERSION VERSION_CODE
          python3 - <<'PY'
          import os,re
          p='android/app/build.gradle'
          s=open(p,encoding='utf-8').read()
          version=os.environ['VERSION']
          code=os.environ['VERSION_CODE']
          s=re.sub(r'versionCode\s+\d+', f'versionCode {code}', s)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', f'versionName "{version}"', s)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Add native APK updater bridge
        run: bash apk-native-bridge.sh

      - name: Configure release signing when secrets exist
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/tokokasirlussal-release.jks
            test -s android/tokokasirlussal-release.jks
            python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          marker='android {'
          signing='''\n    signingConfigs {\n        release {\n            storeFile file("../tokokasirlussal-release.jks")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n'''
          if 'signingConfigs {' not in s:
              s=s.replace(marker, marker+signing, 1)
          if 'signingConfig signingConfigs.release' not in s:
              s=s.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }', 1)
          p.write_text(s, encoding='utf-8')
          PY
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; building a debug APK instead."
          fi

      - name: Sync Android
        run: ./node_modules/.bin/cap sync android

      - name: Build signed Release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Build Debug APK without release secrets
        if: steps.signing.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Select APK
        id: apk
        shell: bash
        run: |
          set -e
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          else
            APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirLussal-Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish signed APK to GitHub Release
        if: steps.signing.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          APK="${{ steps.apk.outputs.path }}"
          RELEASE_APK="TokoKasirLussal-v$VERSION.apk"
          cp "$APK" "$RELEASE_APK"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$RELEASE_APK" --clobber
          else
            gh release create "v$VERSION" "$RELEASE_APK#TokoKasirLussal APK v$VERSION" \
              --title "TokoKasirLussal Android v$VERSION" \
              --notes "Android APK v$VERSION" \
              --target main
          fi
