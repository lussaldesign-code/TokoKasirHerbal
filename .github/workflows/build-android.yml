name: Build TokoKasirHerbal Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index-supabase.html'
      - 'app.js'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'icon-*.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare web app
        shell: bash
        run: |
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js mobile/www/
          sed -i 's#config.js#config.js?v=20260923#g' mobile/www/index.html
          sed -i 's#app.js#app.js?v=20260923#g' mobile/www/index.html

      - name: Check Android build environment
        shell: bash
        run: |
          node --version
          npm --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;36.0.0' || true

      - name: Install dependencies
        shell: bash
        run: |
          npm config set production false
          npm install --include=dev --legacy-peer-deps --no-audit --no-fund
          node -e "console.log('TypeScript:', require('typescript/package.json').version)"
          node -e "console.log('Capacitor CLI:', require('@capacitor/cli/package.json').version)"

      - name: Verify Capacitor
        shell: bash
        run: |
          npx cap --version
          npm ls @capacitor/cli @capacitor/core @capacitor/android --depth=0

      - name: Force Capacitor JSON configuration
        shell: bash
        run: |
          echo "Workspace: $(pwd)"
          find . -type f \( -name 'capacitor.config.ts' -o -name 'capacitor.config.js' -o -name 'capacitor.config.json' \) -print
          find . -type f -name 'capacitor.config.ts' -delete
          find . -type f -name 'capacitor.config.js' -delete
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.herbalinovasi.tokokasir",
            "appName": "TokoKasirHerbal",
            "webDir": "mobile/www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          echo "Capacitor config files after cleanup:"
          find . -type f \( -name 'capacitor.config.ts' -o -name 'capacitor.config.js' -o -name 'capacitor.config.json' \) -print
          test ! -e capacitor.config.ts
          test ! -e capacitor.config.js
          test -f capacitor.config.json
          node -e "console.log(require('./capacitor.config.json'))"

      - name: Add Android platform
        shell: bash
        run: |
          rm -rf android
          npx --no-install cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Prepare Gradle
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace --warning-mode all -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirHerbal-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
