name: Windows Software Build

on:
  workflow_dispatch:
    inputs:
      build_label:
        description: "Catatan build Windows (opsional)"
        required: false
        default: "TokoKasirLussal Windows"
  push:
    paths:
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "config.js"
      - "index.html"
      - "index-supabase.html"
      - ".github/workflows/windows-software-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-software-build
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build installer Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirLussal-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
