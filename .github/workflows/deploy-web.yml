name: Deploy TokoKasirHerbal Web Shell

on:
  push:
    branches: [main]
    paths-ignore:
      - 'TokoKasirHerbal-latest.apk'
      - 'TokoKasirHerbal-latest.exe'
      - 'update.json'
      - 'windows-update.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web shell
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html app.js config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js web-version.json _site/
          WEB_VERSION="$(node -p "require('./web-version.json').version")"
          node - <<'NODE'
          const fs=require('fs');
          const source=JSON.parse(fs.readFileSync('web-version.json','utf8'));
          const out={
            version:String(source.version||'').trim(),
            commit:process.env.GITHUB_SHA,
            updatedAt:new Date().toISOString()
          };
          if(!/^\d+\.\d+\.\d+$/.test(out.version)) throw new Error('web-version.json version tidak valid: '+out.version);
          fs.writeFileSync('_site/web-version.json',JSON.stringify(out,null,2)+'\n');
          NODE
          rm -f _site/update.json _site/windows-update.json
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
