name: Build Fresh TokoKasirLussal APK V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apk-version.txt'
      - 'apk-navigation-v2.js'
      - 'apk-navigation-v2.css'
      - 'apk-icon.svg'
      - 'apk-update.js'
      - '.github/workflows/build-apk-v2.yml'
concurrency:
  group: tokokasirlussal-fresh-apk
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Prepare fresh APK bundle
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          export VERSION
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js config.js sw.js mobile/www/
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path("mobile/www/app.js")
          s=p.read_text(encoding="utf-8")
          v=os.environ["VERSION"]
          s=re.sub(r"const APP_VERSION='[^']*';", "const APP_VERSION='"+v+"';", s, count=1)
          p.write_text(s, encoding="utf-8")
          PY
          cp apk-navigation-v2.css apk-navigation-v2.js apk-icon.svg apk-update.js mobile/www/
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p = Path("mobile/www/index.html")
          s = p.read_text(encoding="utf-8")
          for ident in ["tokokasirlussal-mobile-nav-v4", "tokokasirlussal-apk-swipe-nav-script"]:
              style_pat = r"""<style[^>]*id=["']""" + re.escape(ident) + r"""["'][^>]*>.*?</style>"""
              script_pat = r"""<script[^>]*id=["']""" + re.escape(ident) + r"""["'][^>]*>.*?</script>"""
              s = re.sub(style_pat, "", s, flags=re.S | re.I)
              s = re.sub(script_pat, "", s, flags=re.S | re.I)
          s = s.replace("apk-navigation.css", "apk-navigation-v2.css")
          s = s.replace("apk-navigation.js", "apk-navigation-v2.js")
          s = s.replace("</body>", "<script src=\"apk-update.js?v=" + os.environ["VERSION"] + "\"></script></body>", 1)
          s = s.replace("icon-192.svg", "apk-icon.svg")
          s = s.replace("icon-512.svg", "apk-icon.svg")
          s = re.sub(r"""config\.js\?v=[^"']+""", "config.js?v=" + os.environ["VERSION"], s)
          s = re.sub(r"""app\.js\?v=[^"']+""", "app.js?v=" + os.environ["VERSION"], s)
          p.write_text(s, encoding="utf-8")
          PY
          sed -i "s#tokokasirlussal-v[0-9.]*#tokokasirlussal-v$VERSION#g" mobile/www/sw.js
          echo "Prepared APK bundle version $VERSION"
      - name: Install packages
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Generate Android
        run: rm -rf android && ./node_modules/.bin/cap add android
      - name: Set version and icon
        shell: bash
        run: |
          set -e
          VERSION="$(tr -d '[:space:]' < apk-version.txt)"
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          v = open("apk-version.txt", encoding="utf-8").read().strip()
          a = list(map(int, v.split(".")))
          code = a[0] * 10000 + a[1] * 100 + a[2]
          s = re.sub(r"versionCode\s+\d+", f"versionCode {code}", s)
          s = re.sub(r"""versionName\s+['"][^'"]+['"]""", f'versionName "{v}"', s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            d="android/app/src/main/res/mipmap-$density"
            mkdir -p "$d"
            convert mobile/www/apk-icon.svg -resize "${size}x${size}" "$d/ic_launcher.png"
            cp "$d/ic_launcher.png" "$d/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          # APK splash: gunakan tema hijau TokoKasirLussal, bukan splash putih bawaan
          mkdir -p android/app/src/main/res/values android/app/src/main/res/drawable
          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="tokokasir_splash_bg">#06140E</color>
          </resources>
          EOF
          cat > android/app/src/main/res/drawable/tokokasir_splash_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/tokokasir_splash_bg"/>
            <item android:gravity="center" android:width="180dp" android:height="180dp">
              <bitmap android:src="@mipmap/ic_launcher" android:gravity="fill"/>
            </item>
          </layer-list>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/res/values/styles.xml")
          s=p.read_text(encoding="utf-8")
          if "tokokasir_splash_bg" not in s:
              s=s.replace("</resources>", """<style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                <item name="android:windowBackground">@drawable/tokokasir_splash_bg</item>
                <item name="android:windowSplashScreenBackground">@color/tokokasir_splash_bg</item>
                <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
                <item name="android:windowLightStatusBar">false</item>
                <item name="android:statusBarColor">@color/tokokasir_splash_bg</item>
              </style>
            </resources>""")
              p.write_text(s,encoding="utf-8")
          PY
          echo "TokoKasirLussal themed splash installed"
      - name: Add native APK updater bridge
        shell: bash
        run: |
          set -e
          SRC="android/app/src/main/java/com/lussaldesign/tokokasirlussal"
          mkdir -p "$SRC"
          cat > "$SRC/UpdateBridge.java" <<'JAVA'
package com.lussaldesign.tokokasirlussal;

import android.app.DownloadManager;
import android.content.Context;
import android.content.Intent;
import android.net.Uri;
import android.os.Build;
import android.os.Environment;
import android.provider.Settings;
import android.webkit.JavascriptInterface;
import java.util.Locale;

public class UpdateBridge {
    private final Context context;
    private final DownloadManager manager;
    public UpdateBridge(Context context) {
        this.context=context.getApplicationContext();
        this.manager=(DownloadManager)context.getSystemService(Context.DOWNLOAD_SERVICE);
    }
    @JavascriptInterface public String downloadApk(String url) {
        try {
            DownloadManager.Request request=new DownloadManager.Request(Uri.parse(url));
            request.setTitle("TokoKasirLussal update");
            request.setDescription("Mengunduh update aplikasi...");
            request.setMimeType("application/vnd.android.package-archive");
            request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
            request.setAllowedOverMetered(true);
            request.setAllowedOverRoaming(false);
            request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,"TokoKasirLussal-update.apk");
            return String.valueOf(manager.enqueue(request));
        } catch(Exception e) { return "0"; }
    }
    @JavascriptInterface public String getStatus(String idText) {
        DownloadManager.Query query=new DownloadManager.Query();
        try {
            long id=Long.parseLong(idText); query.setFilterById(id);
            android.database.Cursor c=manager.query(query);
            if(c==null)return "{\"status\":\"error\",\"message\":\"DownloadManager tidak tersedia.\"}";
            try {
                if(!c.moveToFirst())return "{\"status\":\"error\",\"message\":\"Download tidak ditemukan.\"}";
                int st=c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                long received=c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                long total=c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                if(st==DownloadManager.STATUS_SUCCESSFUL)return json("success",received,total,"");
                if(st==DownloadManager.STATUS_FAILED){
                    int reason=c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_REASON));
                    return json("failed",received,total,"DownloadManager error "+reason);
                }
                return json("downloading",received,total,"");
            } finally { c.close(); }
        } catch(Exception e) {
            return "{\"status\":\"error\",\"message\":\"" + escape(e.getMessage()) + "\"}";
        }
    }
    @JavascriptInterface public String installApk(String idText) {
        try {
            long id=Long.parseLong(idText);
            Uri uri=manager.getUriForDownloadedFile(id);
            if(uri==null)return "File update belum selesai diunduh.";
            if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O && !context.getPackageManager().canRequestPackageInstalls()){
                Intent settings=new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:"+context.getPackageName()));
                settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                context.startActivity(settings);
                return "permission";
            }
            Intent intent=new Intent(Intent.ACTION_INSTALL_PACKAGE);
            intent.setDataAndType(uri,"application/vnd.android.package-archive");
            intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_ACTIVITY_NEW_TASK);
            context.startActivity(intent);
            return "ok";
        } catch(Exception e) { return "error: "+e.getMessage(); }
    }
    private static String json(String status,long received,long total,String message){
        return String.format(Locale.US,"{\"status\":\"%s\",\"received\":%d,\"total\":%d,\"message\":\"%s\"}",status,received,total,escape(message));
    }
    private static String escape(String s){return s==null?"":s.replace("\\","\\\\").replace("\"","\\\"").replace("\n"," ");}
}

JAVA
          cat > "$SRC/MainActivity.java" <<'JAVA'
package com.lussaldesign.tokokasirlussal;

import android.os.Bundle;
import android.webkit.WebView;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        WebView webView=getBridge().getWebView();
        if(webView!=null)webView.addJavascriptInterface(new UpdateBridge(this),"AndroidUpdater");
    }
}

JAVA
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          perm='<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n'
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s=s.replace('<manifest ', '<manifest '+perm, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Sync
        run: ./node_modules/.bin/cap sync android
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKasirLussal-Fresh-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
