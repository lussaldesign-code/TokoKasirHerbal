name: Restore TokoKasirLussal APK 1.0.20

on:
  # Historical recovery workflow: manual artifact build only.
  # It can never replace the current APK/update manifest.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokokasirlussal-restore-1-0-20
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare exact 1.0.20 APK sources
        run: |
          set -e
          rm -rf mobile
          mkdir -p mobile/www
          cp index-supabase.html mobile/www/index.html
          cp app.js mobile/www/app.js
          cp apk-navigation.css mobile/www/apk-navigation.css
          cp apk-navigation.js mobile/www/apk-navigation.js
          cp config.js manifest.webmanifest icon-192.svg icon-512.svg sw.js mobile/www/
          sed -i 's#config.js#config.js?v=1.0.20#g' mobile/www/index.html
          sed -i 's#app.js#app.js?v=1.0.20#g' mobile/www/index.html
          sed -i 's#tokokasirlussal-v[0-9.]*#tokokasirlussal-v1.0.20#g' mobile/www/sw.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile/www/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</head>', '<link rel="stylesheet" href="apk-navigation.css?v=1.0.20"></head>', 1)
          s=s.replace('</body>', '<script src="apk-navigation.js?v=1.0.20"></script></body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          test -s mobile/www/app.js
          test -s mobile/www/index.html

      - name: Install npm packages
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        run: |
          rm -rf android
          ./node_modules/.bin/cap add android

      - name: Set Android version 1.0.20
        run: |
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 100020', s)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.0.20"', s)
          open(p,'w').write(s)
          PY

      - name: Sync Android
        run: ./node_modules/.bin/cap sync android

      - name: Build 1.0.20 APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Verify APK
        run: |
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload 1.0.20 artifact
        uses: actions/upload-artifact@v7
        with:
          name: TokoKasirLussal-Android-APK-v1.0.20
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Do not publish historical APK
        run: |
          echo "Historical 1.0.20 build is artifact-only."
          echo "Current APK version remains controlled exclusively by apk-version.txt."
